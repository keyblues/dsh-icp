# 工信部 ICP 备案查询 — Host 插件（原生 Node 实现）。
#
# 单条 Host 条目：工具（icp_query / icp_query_types）由 index.js 在 Host 侧直接
# 注册，不经过 MCP，也不依赖任何外部服务或 API Key；client.js 只向会话工具卡片
# 槽位（tool.call.toolview）注册官方样式卡片，没有设置页也不注册 HTTP 路由。
#
# 下列 config 全部有代码内默认值（由 index.js 的 DEFAULTS / normalizeConfig 归一化，实现见 lib/miit.js）：
#   captchaMaxAttempts  单次查询内滑块验证码的最大尝试次数，默认 5，范围 1-10；
#                       验证码会话在有效期内复用，只有会话过期后的首次查询需要解一次新的滑块验证码。
#   timeoutMs           单次上游 HTTP 请求超时（毫秒），默认 30000，范围 5000-120000。
#   maxPageSize         单页返回条数上限，默认 10，范围 1-26；工具传入的 page_size 会被截断到该值。
#   detailConcurrency   并发拉取 APP/小程序/快应用详情的数量，默认 5，范围 1-10。
#   includeDetails      是否为 APP/小程序/快应用补充 queryDetailByAppAndMiniId 详情，默认 true。
#
# 可以在本 profile 的 cordis.patch.yml 里按 id 覆盖 config，例如：
#   - id: dsh-icp
#     config:
#       timeoutMs: 45000
#       includeDetails: false
- insert:
    - id: dsh-icp
      name: '@local/dsh-icp'
      config:
        captchaMaxAttempts: 5
        timeoutMs: 30000
        maxPageSize: 10
        detailConcurrency: 5
        includeDetails: true
